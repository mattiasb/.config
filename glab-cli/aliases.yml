---
# group-clone <GROUP>
group-clone: repo clone -g $1 -a=false -S=false -p --paginate

# images [REPOSITORY] [TAGS-PER-PAGE]
images: '!glab registry-tag-ls "${1:-$(glab image-repos | fzf)}" "${2:-}"'
image-repos: "!glab registry-repo-ls"
image-delete: >-
  !echo glab container-registry tag delete
  "$(glab registry-repo-id "${1/./""}")"
  "${2}"

### REGISTRY ###

registry-repo-ls: >
  container-registry repository list -F json --jq 'sort_by(.path)[] | .path'

# registry-repo-id <REPOSITORY>
registry-repo-id: >-
  !glab container-registry repository list
  --output json
  --jq '.[] | select(.name == "'"${1:-}"'" or .path == "'"${1:-}"'") | .id'

# registry-repo-ls <REPOSITORY> [TAGS-PER-PAGE]
registry-tag-ls: >-
  !glab container-registry tag list $(glab registry-repo-id "${1/./""}")
  --details
  ${2:+ "--per-page=${2/--all/10000}"}
  --output json
  --jq '# https://users.aalto.fi/~tontti/posts/jq-and-human-readable-bytes/
        def size:
          def _size(v; u):
            if (u | length) == 1 or (u[0] == "" and v < 10240) or v < 1024 then
              "\(v | round) \(u[0])B"
            else
              _size(v/1024; u[1:])
            end;
        _size(.; ":Ki:Mi:Gi:Ti:Pi:Ei:Zi:Yi" / ":");

        def strip_ms:
          sub( "^(?<a>.+?)(\\.[0-9]+)?(?<b>Z|[+-][0-9]{2}:?[0-9]{2})$"
             ; "\(.a)\(.b)");

        def time(f):
          . | strip_ms
            | strptime("%Y-%m-%dT%H:%M:%S%z")
            | strftime(f);

        ########################################################################

        map(.created_at = (.created_at // "1970-01-01T00:00:00Z"))
           | sort_by(.created_at)[]
           | [ .name
             , (.total_size | size)
             , (.created_at | time("%Y-%m-%d"))
             , (.created_at | time("%H:%M:%S"))
             ]
           | @tsv
  '
  | column -s '	' -t -C name=TAG -C name=SIZE,right -C name=DATE -C name=TIME
